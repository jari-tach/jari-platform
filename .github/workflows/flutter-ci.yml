name: Flutter CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Security: Define minimal required permissions
permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true

      - name: Verify Flutter toolchain
        run: |
          flutter --version
          dart --version
          flutter --version | grep -F "Flutter 3.44.7"
          dart --version | grep -F "3.12.2"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

  test:
    name: Flutter Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true

      - name: Verify Flutter toolchain
        run: |
          flutter --version
          dart --version
          flutter --version | grep -F "Flutter 3.44.7"
          dart --version | grep -F "3.12.2"

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [analyze, test]

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true

      - name: Verify Flutter toolchain
        run: |
          flutter --version
          dart --version
          flutter --version | grep -F "Flutter 3.44.7"
          dart --version | grep -F "3.12.2"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [analyze, test]

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'
          cache: true

      - name: Verify Flutter toolchain
        run: |
          flutter --version
          dart --version
          flutter --version | grep -F "Flutter 3.44.7"
          dart --version | grep -F "3.12.2"

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --debug --no-codesign
