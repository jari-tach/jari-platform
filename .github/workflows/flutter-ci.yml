# W5 — protected CI (analyze/test + optional signed release jobs)
#
# Signing jobs never run on pull_request and never receive fork secrets.
# Production/test signing only on refs/heads/release/* or refs/tags/v*.
# Actions pinned to immutable commit SHAs.
# GitHub Environment policy is EXTERNAL — see docs/platform/W5_GITHUB_ENVIRONMENT_SETUP.md
# (CI PROTECTION remains UNPROVEN until that checklist is confirmed outside Git).

name: Flutter CI / W5 Signing

on:
  push:
    branches: [main, develop, release/**, fix/**]
    tags: ["v*"]
  pull_request:
    branches: [main, develop, release/**]
  workflow_dispatch:
    inputs:
      sign_android_test:
        description: "TEST SIGNING ONLY — ephemeral Android keystore (not production). Ref must be release/* or v*."
        type: boolean
        default: false
      allow_production_sign:
        description: "REAL production Android/iOS signing for M3 Phase 2 evidence only (not store upload). Ref must be release/* or v*."
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: w5-driver-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"
  # Expected store IDs (non-secret). Production signing still requires Environment secrets.
  IOS_BUNDLE_ID_DEFAULT: "com.saeq.driver"

jobs:
  analyze_test:
    name: Analyze / Test / Signing plumbing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Release backend mode gate
        run: dart run tool/check_release_backend_mode.dart

      - name: Android release signing plumbing gate
        run: dart run tool/check_android_release_signing.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Negative release gate (missing key.properties must fail)
        run: |
          set -e
          rm -f android/key.properties
          if flutter build appbundle --release; then
            echo "expected release build to fail without key.properties" >&2
            exit 1
          fi
          echo "negative missing-credential gate PASS"

  ios_compile_no_codesign:
    name: iOS compile (--no-codesign)
    runs-on: macos-latest
    needs: [analyze_test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: iOS compilation only (not W5 PASS)
        run: flutter build ios --release --no-codesign


  # No environment / secrets / id-token — job-level gate only.
  signing_ref_gate:
    name: W5 signing ref gate
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/heads/release/') ||
       startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enforce signing ref allowlist
        run: bash tool/w5_enforce_signing_ref.sh "${{ github.ref }}" gate

  ios_ipa_production:
    name: iOS IPA production (protected)
    runs-on: macos-latest
    needs: [analyze_test, signing_ref_gate]
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.allow_production_sign == true &&
      needs.analyze_test.result == 'success' &&
      needs.signing_ref_gate.result == 'success' &&
      (startsWith(github.ref, 'refs/heads/release/') ||
       startsWith(github.ref, 'refs/tags/v'))
    environment: w5-signing-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enforce signing ref allowlist
        run: bash tool/w5_enforce_signing_ref.sh "${{ github.ref }}" production
      - name: Require Apple signing material (fail-closed)
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ vars.IOS_PROVISIONING_PROFILE_NAME }}
          APPLE_DISTRIBUTION_CERT_SHA256: ${{ vars.APPLE_DISTRIBUTION_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for v in APPLE_CERT_P12_BASE64 APPLE_PROVISIONING_PROFILE_BASE64 APPLE_CERT_PASSWORD \
                   APPLE_TEAM_ID IOS_BUNDLE_ID IOS_PROVISIONING_PROFILE_NAME APPLE_DISTRIBUTION_CERT_SHA256; do
            if [ -z "${!v}" ]; then
              echo "Production iOS signing requires $v (Environment) — fail-closed." >&2
              exit 1
            fi
          done
      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Import cert + profile (paths never printed)
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ vars.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/dist.p12"
          PROFILE="$RUNNER_TEMP/app.mobileprovision"
          echo "$APPLE_CERT_P12_BASE64" | base64 -d > "$CERT"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE"
          security create-keychain -p "" "$RUNNER_TEMP/w5.keychain"
          security default-keychain -s "$RUNNER_TEMP/w5.keychain"
          security unlock-keychain -p "" "$RUNNER_TEMP/w5.keychain"
          security set-keychain-settings -t 3600 -u "$RUNNER_TEMP/w5.keychain"
          security import "$CERT" -k "$RUNNER_TEMP/w5.keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$RUNNER_TEMP/w5.keychain"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          # Install under UUID name when possible
          PROFILE_UUID="$(security cms -D -i "$PROFILE" 2>/dev/null | plutil -extract UUID raw -o - - 2>/dev/null || true)"
          if [ -n "${PROFILE_UUID:-}" ]; then
            cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          else
            cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/${IOS_PROVISIONING_PROFILE_NAME}.mobileprovision"
          fi
          echo "$PROFILE" > "$RUNNER_TEMP/w5_profile_path.txt"
      - name: Generate App Store ExportOptions
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ vars.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          team=os.environ["APPLE_TEAM_ID"]
          bid=os.environ["IOS_BUNDLE_ID"]
          pname=os.environ["IOS_PROVISIONING_PROFILE_NAME"]
          xml=f'''<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>{team}</string>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>destination</key><string>export</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>{bid}</key><string>{pname}</string>
            </dict>
          </dict></plist>
          '''
          pathlib.Path("ios/ExportOptions-AppStore.plist").write_text(xml, encoding="utf-8")
          PY
      - name: Build IPA (App Store export)
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions-AppStore.plist
      - name: Verify IPA (Distribution + fingerprints)
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          APPLE_DISTRIBUTION_CERT_SHA256: ${{ vars.APPLE_DISTRIBUTION_CERT_SHA256 }}
        run: |
          set -euo pipefail
          IPA=$(ls build/ios/ipa/*.ipa | head -n1)
          bash tool/w5_verify_ios_ipa.sh "$IPA" provenance-w5-ios-prod.txt
          {
            echo "repo=${{ github.repository }}"
            echo "commit=${{ github.sha }}"
            echo "ref=${{ github.ref }}"
            echo "tag=${{ github.ref_name }}"
            echo "run_id=${{ github.run_id }}"
            echo "flutter=${{ env.FLUTTER_VERSION }}"
            echo "signing=PRODUCTION_APPLE_DISTRIBUTION"
            cat provenance-w5-ios-prod.txt
          } | tee provenance-w5-ios-prod-full.txt
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: driver-w5-production-ipa
          path: |
            build/ios/ipa/*.ipa
            provenance-w5-ios-prod-full.txt
      - name: Cleanup Apple material
        if: always()
        run: |
          set +e
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/app.mobileprovision" ios/ExportOptions-AppStore.plist
          if [ -f "$RUNNER_TEMP/w5_profile_path.txt" ]; then
            rm -f "$(cat "$RUNNER_TEMP/w5_profile_path.txt")"
          fi
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"/*
          security delete-keychain "$RUNNER_TEMP/w5.keychain" 2>/dev/null
          security list-keychains -d user -s login.keychain-db 2>/dev/null
          rm -f "$RUNNER_TEMP/w5_profile_path.txt"

  android_test_sign:
    name: Android TEST SIGNING ONLY
    runs-on: ubuntu-latest
    needs: [analyze_test, signing_ref_gate]
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.sign_android_test == true &&
      needs.analyze_test.result == 'success' &&
      needs.signing_ref_gate.result == 'success' &&
      (startsWith(github.ref, 'refs/heads/release/') ||
       startsWith(github.ref, 'refs/tags/v'))
    environment: w5-signing-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enforce signing ref allowlist
        run: bash tool/w5_enforce_signing_ref.sh "${{ github.ref }}" test
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Ephemeral TEST SIGNING ONLY keystore
        id: ks
        working-directory: android
        run: |
          set -euo pipefail
          echo "TEST SIGNING ONLY — not production"
          KEYSTORE="$RUNNER_TEMP/w5-test-upload.jks"
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -alias w5test \
            -keyalg RSA -keysize 2048 -validity 30 \
            -storepass "test-only-store" \
            -keypass "test-only-key" \
            -dname "CN=W5 Test Signing Only, OU=SAEQ, O=SAEQ, L=Riyadh, C=SA"
          FP="$(keytool -list -v -keystore "$KEYSTORE" -storepass "test-only-store" -alias w5test \
            | grep -i 'SHA256:' | head -n1 | sed -E 's/.*SHA256:[[:space:]]*//' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          echo "cert_sha256=$FP" >> "$GITHUB_OUTPUT"
          printf '%s\n' \
            "storePassword=test-only-store" \
            "keyPassword=test-only-key" \
            "keyAlias=w5test" \
            "storeFile=$KEYSTORE" > key.properties
          echo "ANDROID_UPLOAD_CERT_SHA256=$FP" >> "$GITHUB_ENV"
      - name: Build AAB + proof APK
        run: |
          set -euo pipefail
          flutter build appbundle --release
          flutter build apk --release
      - name: Verify jarsigner/apksigner + fingerprint pin
        env:
          ANDROID_UPLOAD_CERT_SHA256: ${{ steps.ks.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          APK=build/app/outputs/flutter-apk/app-release.apk
          bash tool/w5_verify_android_artifacts.sh "$AAB" "$APK" provenance-w5-test-core.txt
          {
            echo "signing=TEST_SIGNING_ONLY"
            echo "not_production=true"
            echo "repo=${{ github.repository }}"
            echo "commit=${{ github.sha }}"
            echo "ref=${{ github.ref }}"
            echo "run_id=${{ github.run_id }}"
            echo "flutter=${{ env.FLUTTER_VERSION }}"
            cat provenance-w5-test-core.txt
          } | tee provenance-w5-test.txt
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: driver-w5-test-signed-android
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
            provenance-w5-test.txt
      - name: Cleanup signing material
        if: always()
        run: |
          rm -f android/key.properties
          rm -f "$RUNNER_TEMP/w5-test-upload.jks" || true

  android_production_sign:
    name: Android production sign (protected)
    runs-on: ubuntu-latest
    needs: [analyze_test, signing_ref_gate]
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.allow_production_sign == true &&
      needs.analyze_test.result == 'success' &&
      needs.signing_ref_gate.result == 'success' &&
      (startsWith(github.ref, 'refs/heads/release/') ||
       startsWith(github.ref, 'refs/tags/v'))
    environment: w5-signing-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enforce signing ref allowlist
        run: bash tool/w5_enforce_signing_ref.sh "${{ github.ref }}" production
      - name: Require production secrets (fail-closed)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_KEY_PROPERTIES}" ] || [ -z "${ANDROID_UPLOAD_CERT_SHA256}" ]; then
            echo "Production Android signing requires keystore + key.properties + ANDROID_UPLOAD_CERT_SHA256 — fail-closed." >&2
            exit 1
          fi
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Materialize keystore from secret store
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/upload.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          printf '%s\n' "$ANDROID_KEY_PROPERTIES" | sed "s|storeFile=.*|storeFile=$KEYSTORE|" > key.properties
      - name: Build AAB + proof APK
        run: |
          set -euo pipefail
          flutter build appbundle --release
          flutter build apk --release
      - name: Verify + pin fingerprint + provenance
        env:
          ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          APK=build/app/outputs/flutter-apk/app-release.apk
          bash tool/w5_verify_android_artifacts.sh "$AAB" "$APK" provenance-w5-prod-core.txt
          {
            echo "repo=${{ github.repository }}"
            echo "commit=${{ github.sha }}"
            echo "ref=${{ github.ref }}"
            echo "tag=${{ github.ref_name }}"
            echo "run_id=${{ github.run_id }}"
            echo "flutter=${{ env.FLUTTER_VERSION }}"
            echo "signing=PRODUCTION_UPLOAD_KEY"
            cat provenance-w5-prod-core.txt
          } | tee provenance-w5-prod.txt
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: driver-w5-production-android
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
            provenance-w5-prod.txt
      - name: Cleanup
        if: always()
        run: |
          rm -f android/key.properties
          rm -f "$RUNNER_TEMP/upload.jks" || true
