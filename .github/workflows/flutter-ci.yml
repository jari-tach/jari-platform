# W5 — protected CI (analyze/test + optional signed release jobs)
#
# Signing jobs never run on pull_request and never receive fork secrets.
# Actions pinned to immutable commit SHAs.

name: Flutter CI / W5 Signing

on:
  push:
    branches: [main, develop, release/**, fix/**]
    tags: ["v*"]
  pull_request:
    branches: [main, develop, release/**]
  workflow_dispatch:
    inputs:
      sign_android_test:
        description: "TEST SIGNING ONLY — ephemeral Android keystore (not production)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: w5-driver-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"

jobs:
  analyze_test:
    name: Analyze / Test / Signing plumbing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Release backend mode gate
        run: dart run tool/check_release_backend_mode.dart

      - name: Android release signing plumbing gate
        run: dart run tool/check_android_release_signing.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Negative release gate (missing key.properties must fail)
        run: |
          set -e
          rm -f android/key.properties
          if flutter build appbundle --release; then
            echo "expected release build to fail without key.properties" >&2
            exit 1
          fi
          echo "negative missing-credential gate PASS"

  ios_compile_no_codesign:
    name: iOS compile (--no-codesign)
    runs-on: macos-latest
    needs: [analyze_test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: iOS compilation only (not W5 PASS)
        run: flutter build ios --release --no-codesign

  ios_ipa_production:
    name: iOS IPA production (protected)
    runs-on: macos-latest
    needs: [analyze_test]
    if: >
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) &&
      github.event_name != 'pull_request'
    environment: w5-signing-production
    steps:
      - name: Require Apple signing secrets (fail-closed)
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERT_P12_BASE64}" ] || [ -z "${APPLE_PROVISIONING_PROFILE_BASE64}" ] || [ -z "${APPLE_CERT_PASSWORD}" ]; then
            echo "Production iOS signing secrets not provisioned — fail-closed." >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Import cert + profile (paths never printed)
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/dist.p12"
          PROFILE="$RUNNER_TEMP/app.mobileprovision"
          echo "$APPLE_CERT_P12_BASE64" | base64 -d > "$CERT"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE"
          security create-keychain -p "" "$RUNNER_TEMP/w5.keychain"
          security default-keychain -s "$RUNNER_TEMP/w5.keychain"
          security unlock-keychain -p "" "$RUNNER_TEMP/w5.keychain"
          security import "$CERT" -k "$RUNNER_TEMP/w5.keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/"
      - name: Build IPA
        run: flutter build ipa --release
      - name: codesign verify
        run: |
          set -euo pipefail
          APP=$(echo build/ios/ipa/*.ipa)
          unzip -q "$APP" -d "$RUNNER_TEMP/ipa"
          codesign --verify --deep --strict "$RUNNER_TEMP/ipa/Payload/"*.app
      - name: Cleanup
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/app.mobileprovision" || true
          security delete-keychain "$RUNNER_TEMP/w5.keychain" || true

  android_test_sign:
    name: Android TEST SIGNING ONLY
    runs-on: ubuntu-latest
    needs: [analyze_test]
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.sign_android_test == true
    environment: w5-signing-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Ephemeral TEST SIGNING ONLY keystore
        working-directory: android
        run: |
          set -euo pipefail
          echo "TEST SIGNING ONLY — not production"
          KEYSTORE="$RUNNER_TEMP/w5-test-upload.jks"
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -alias w5test \
            -keyalg RSA -keysize 2048 -validity 30 \
            -storepass "test-only-store" \
            -keypass "test-only-key" \
            -dname "CN=W5 Test Signing Only, OU=SAEQ, O=SAEQ, L=Riyadh, C=SA"
          printf '%s\n' \
            "storePassword=test-only-store" \
            "keyPassword=test-only-key" \
            "keyAlias=w5test" \
            "storeFile=$KEYSTORE" > key.properties
      - run: flutter build appbundle --release
      - name: Verify jarsigner + reject debug + SHA-256
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs "$AAB"
          if jarsigner -verify -verbose -certs "$AAB" 2>&1 | grep -qi "CN=Android Debug"; then
            echo "debug certificate detected" >&2
            exit 1
          fi
          sha256sum "$AAB" | tee provenance-w5-test.txt
          echo "signing=TEST_SIGNING_ONLY" >> provenance-w5-test.txt
          echo "commit=${{ github.sha }}" >> provenance-w5-test.txt
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: driver-w5-test-signed-aab
          path: |
            build/app/outputs/bundle/release/app-release.aab
            provenance-w5-test.txt
      - name: Cleanup signing material
        if: always()
        run: |
          rm -f android/key.properties
          rm -f "$RUNNER_TEMP/w5-test-upload.jks" || true

  android_production_sign:
    name: Android production sign (protected)
    runs-on: ubuntu-latest
    needs: [analyze_test]
    if: >
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) &&
      github.event_name != 'pull_request'
    environment: w5-signing-production
    steps:
      - name: Require production secrets (fail-closed)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_KEY_PROPERTIES}" ]; then
            echo "Production Android signing secrets not provisioned — fail-closed." >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Materialize keystore from secret store
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/upload.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          printf '%s\n' "$ANDROID_KEY_PROPERTIES" | sed "s|storeFile=.*|storeFile=$KEYSTORE|" > key.properties
      - run: flutter build appbundle --release
      - name: Verify + fingerprint
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs "$AAB"
          if jarsigner -verify -verbose -certs "$AAB" 2>&1 | grep -qi "CN=Android Debug"; then
            echo "debug certificate detected" >&2
            exit 1
          fi
          {
            echo "repo=${{ github.repository }}"
            echo "commit=${{ github.sha }}"
            echo "ref=${{ github.ref }}"
            echo "run_id=${{ github.run_id }}"
            echo "flutter=${{ env.FLUTTER_VERSION }}"
            echo "signing=PRODUCTION_SECRETS"
            sha256sum "$AAB"
          } | tee provenance-w5-prod.txt
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: driver-w5-production-aab
          path: |
            build/app/outputs/bundle/release/app-release.aab
            provenance-w5-prod.txt
      - name: Cleanup
        if: always()
        run: |
          rm -f android/key.properties
          rm -f "$RUNNER_TEMP/upload.jks" || true
